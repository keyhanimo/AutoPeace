  /changelog.xml:
    get:
      operationId: getChangelogRss
      tags: [changelog]
      summary: RSS feed of research cycle changelog entries
      description: >
        Returns an RSS 2.0 XML feed containing recent changelog entries, one item per
        completed research cycle. Subscribe in any RSS reader to track forecast shifts,
        deal score changes, and evidence updates over time.
      responses:
        "200":
          description: RSS 2.0 XML feed
          content:
            application/rss+xml:
              schema: { type: string }

  /subscribe:
    post:
      operationId: subscribeEmail
      tags: [subscribe]
      summary: Subscribe to email research update digests
      description: >
        Public endpoint. Stores the email address for future digest delivery.
        Idempotent: submitting an already-subscribed address returns a confirmation
        without creating a duplicate. Re-subscribing an unsubscribed address re-activates it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                  description: Email address to subscribe
                name:
                  type: string
                  description: Subscriber display name (optional)
                source:
                  type: string
                  description: Signup source identifier (e.g. "open-source-page")
      responses:
        "200":
          description: Subscription confirmed or already exists
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  message: { type: string }
                required: [message]
        "400":
          description: Invalid email address
    delete:
      operationId: unsubscribeEmail
      tags: [subscribe]
      summary: Unsubscribe from email research update digests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
      responses:
        "200":
          description: Unsubscribed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                required: [message]
        "400":
          description: Email is required

  /admin/subscribers:
    get:
      operationId: adminListSubscribers
      tags: [subscribe, admin]
      summary: List all email subscribers (admin only)
      security:
        - adminKey: []
      responses:
        "200":
          description: List of email subscribers
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EmailSubscription"
                  activeCount: { type: integer }
                  total: { type: integer }
                required: [data, activeCount, total]
        "401":
          description: Unauthorized

components:
  securitySchemes:
    adminKey:
      type: apiKey
      in: header
      name: X-Admin-Key

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    EmailSubscription:
      type: object
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string, nullable: true }
        subscribedAt: { type: string, format: date-time }
        confirmed: { type: boolean }
        unsubscribedAt: { type: string, format: date-time, nullable: true }
        source: { type: string }
      required: [id, email, subscribedAt, confirmed, source]

    ForecastProbabilities:
      type: object
      properties:
        continued_conflict:
          type: number
        informal_deescalation:
          type: number
        limited_ceasefire:
          type: number
        humanitarian_mini_deal:
          type: number
        sanctions_partial_deal:
          type: number
        regional_framework:
          type: number
        broad_settlement:
          type: number
        major_escalation:
          type: number
      required:
        - continued_conflict
        - informal_deescalation
        - limited_ceasefire
        - humanitarian_mini_deal
        - sanctions_partial_deal
        - regional_framework
        - broad_settlement
        - major_escalation

    Forecast:
      type: object
      properties:
        id:
          type: string
        cycleId:
          type: string
        experimentId:
          type: string
          nullable: true
        evidencePackVersion:
          type: string
        timeHorizon:
          type: string
          enum: [10d, 30d, 90d, 180d, 1y]
        probabilities:
          $ref: "#/components/schemas/ForecastProbabilities"
        rationale:
          type: string
        keyEvidenceItems:
          type: array
          items:
            type: string
        isCurrent:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - cycleId
        - evidencePackVersion
        - timeHorizon
        - probabilities
        - rationale
        - keyEvidenceItems
        - isCurrent
        - createdAt

    Experiment:
      type: object
      properties:
        id:
          type: string
        cycleId:
          type: string
        timestamp:
          type: string
          format: date-time
        task:
          type: string
          enum: [A, B, both]
        changeDescription:
          type: string
        changeDiff:
          type: string
        scoresBefore:
          type: object
          nullable: true
          additionalProperties: true
        scoresAfter:
          type: object
          nullable: true
          additionalProperties: true
        diagnosis:
          type: string
          nullable: true
        retained:
          type: boolean
        tokensConsumed:
          type: integer
        wallClockSeconds:
          type: integer
          nullable: true
        costUsd:
          type: number
        providerCosts:
          type: object
          nullable: true
          properties:
            gemini:
              type: number
            openai:
              type: number
            anthropic:
              type: number
      required:
        - id
        - cycleId
        - timestamp
        - task
        - changeDescription
        - changeDiff
        - retained
        - tokensConsumed
        - costUsd

    ExperimentStats:
      type: object
      properties:
        total:
          type: integer
        retained:
          type: integer
        retentionRate:
          type: number
        totalCostUsd:
          type: number
        totalTokensConsumed:
          type: integer
        cyclesRun:
          type: integer
      required:
        - total
        - retained
        - retentionRate
        - totalCostUsd
        - totalTokensConsumed
        - cyclesRun

    EconomicCosts:
      type: object
      properties:
        oilPriceImpactUsd:
          type: number
        gdpImpactPct:
          type: number
        sanctionsCostUsd:
          type: number
        militaryExpenditureUsd:
          type: number
        tradeDisruptionUsd:
          type: number
        totalUsd:
          type: number
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CostSource"
      required:
        - totalUsd
        - sources

    HumanitarianCosts:
      type: object
      properties:
        casualtiesEstimate:
          type: integer
        displacedPersons:
          type: integer
        infrastructureDamageUsd:
          type: number
        foodInsecurityAffected:
          type: integer
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CostSource"
      required:
        - sources

    StrategicCosts:
      type: object
      properties:
        proliferationRiskLevel:
          type: string
          enum: [low, medium, high, critical]
        escalationProbability30d:
          type: number
        allianceStabilityIndex:
          type: number
        sources:
          type: array
          items:
            $ref: "#/components/schemas/CostSource"
      required:
        - sources

    CostSource:
      type: object
      properties:
        metric:
          type: string
        sourceName:
          type: string
        sourceUrl:
          type: string
        date:
          type: string
        uncertaintyRange:
          type: string
      required:
        - metric
        - sourceName
        - sourceUrl
        - date

    CostOfWar:
      type: object
      properties:
        id:
          type: string
        stakeholderId:
          type: string
        timestamp:
          type: string
          format: date-time
        economic:
          $ref: "#/components/schemas/EconomicCosts"
        humanitarian:
          $ref: "#/components/schemas/HumanitarianCosts"
        strategic:
          $ref: "#/components/schemas/StrategicCosts"
        dataVersion:
          type: string
      required:
        - id
        - stakeholderId
        - timestamp
        - economic
        - humanitarian
        - strategic
        - dataVersion

    EvidenceItem:
      type: object
      properties:
        id:
          type: string
        source:
          type: string
        sourceUrl:
          type: string
        publishedAt:
          type: string
          format: date-time
        title:
          type: string
        text:
          type: string
        evidenceType:
          type: string
        stakeholderRelevance:
          type: array
          items:
            type: string
        isProcessed:
          type: boolean
        ingestedAt:
          type: string
          format: date-time
        influencedCycleId:
          type: string
          nullable: true
          description: The research cycle ID this evidence item was used in when generating forecasts
        influencedForecastId:
          type: string
          nullable: true
          description: The primary forecast ID this evidence item directly influenced
      required:
        - id
        - source
        - sourceUrl
        - publishedAt
        - title
        - text
        - evidenceType
        - stakeholderRelevance
        - isProcessed
        - ingestedAt

    ChangelogEntry:
      type: object
      properties:
        id:
          type: string
        cycleId:
          type: string
        timestamp:
          type: string
          format: date-time
        headline:
          type: string
        forecastDelta:
          type: object
          nullable: true
          additionalProperties: true
        scoreDelta:
          type: object
          nullable: true
          additionalProperties: true
        keyEvidence:
          type: array
          nullable: true
          items:
            type: object
            additionalProperties: true
        notes:
          type: string
          nullable: true
      required:
        - id
        - cycleId
        - timestamp
        - headline

    Stakeholder:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        role:
          type: string
        region:
          type: string
        flag:
          type: string
        goals:
          type: string
        redLines:
          type: string
        preferredOutcomes:
          type: string
        constraints:
          type: string
        communicationStyle:
          type: string
        tier:
          type: string
        profileSummary:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - role
        - region
        - flag
        - goals
        - redLines
        - preferredOutcomes
        - constraints
        - communicationStyle
        - tier
        - profileSummary
        - createdAt
        - updatedAt

    AdminConfigResponse:
      type: object
      properties:
        cadence:
          type: string
          enum: [every15m, every30m, hourly, daily, weekly, manual]
        budgetCapUsd:
          type: number
        isPaused:
          type: boolean
        anthropicModel:
          type: string
        openaiModel:
          type: string
        geminiModel:
          type: string
        generationProvider:
          type: string
          enum: [anthropic, openai, gemini]
        generationModel:
          type: string
        evaluationProvider:
          type: string
          enum: [anthropic, openai, gemini]
        evaluationModel:
          type: string
        adversarialProvider:
          type: string
          enum: [anthropic, openai, gemini]
        adversarialModel:
          type: string
        forecastingProvider:
          type: string
          enum: [anthropic, openai, gemini]
        forecastingModel:
          type: string
        extractionProvider:
          type: string
          enum: [anthropic, openai, gemini]
        extractionModel:
          type: string
        judgePanelAnthropicModel:
          type: string
        judgePanelOpenaiModel:
          type: string
        judgePanelGeminiModel:
          type: string
        stage1Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage1Model:
          type: string
        stage2Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage2Model:
          type: string
        stage3Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage3Model:
          type: string
        stage4Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage4Model:
          type: string
        stage5Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage5Model:
          type: string
        stage6Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage6Model:
          type: string
        stage7Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage7Model:
          type: string
        stage8Provider:
          type: string
          enum: [anthropic, openai, gemini]
        stage8Model:
          type: string
      required:
        - cadence
        - budgetCapUsd
        - isPaused
        - anthropicModel
        - openaiModel
        - geminiModel
        - generationProvider
        - generationModel
        - evaluationProvider
        - evaluationModel
        - adversarialProvider
        - adversarialModel
        - forecastingProvider
        - forecastingModel
