openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: AutoPeace API — AI-powered conflict forecasting and peace research
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: forecasts
    description: Outcome forecasts (Task A)
  - name: experiments
    description: Autoresearch experiment log
  - name: costs
    description: Cost-of-war data per stakeholder
  - name: evidence
    description: Evidence corpus
  - name: changelog
    description: Per-cycle changelog feed
  - name: stakeholders
    description: Stakeholder profiles
  - name: admin
    description: Admin controls (password protected)
  - name: deals
    description: AI-generated peace deal proposals (Task B)
  - name: proposals
    description: Real-world proposals (US plan, Iran counterproposal)
  - name: community
    description: Community forecasts and public proposal submissions
  - name: downloads
    description: Data download endpoints (CSV/JSON exports)
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /forecasts:
    get:
      operationId: listForecasts
      tags: [forecasts]
      summary: List forecasts
      parameters:
        - name: timeHorizon
          in: query
          schema:
            type: string
            enum: [10d, 30d, 90d, 180d, 1y]
        - name: cycleId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of forecasts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Forecast"
                  total:
                    type: integer
                required: [data, total]

  /forecasts/latest:
    get:
      operationId: getLatestForecasts
      tags: [forecasts]
      summary: Get latest forecast for each time horizon
      responses:
        "200":
          description: Latest forecasts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Forecast"
                required: [data]

  /forecasts/{id}:
    get:
      operationId: getForecast
      tags: [forecasts]
      summary: Get a single forecast
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Forecast detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Forecast"
        "404":
          description: Not found

  /autoresearch/timeline:
    get:
      operationId: getAutoresearchTimeline
      tags: [experiments]
      summary: Deal score timeline across research cycles
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: Timeline of deal score improvements
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealTimeline:
                    type: array
                    items:
                      type: object
                      properties:
                        dealId: { type: string }
                        timestamp: { type: string, format: date-time }
                        compositeScore: { type: number }
                        architecture: { type: string }
                        generation: { type: integer }
                        isCurrent: { type: boolean }
                      required: [dealId, timestamp, compositeScore, architecture, generation, isCurrent]
                required: [dealTimeline]

  /autoresearch/pipeline-evolution:
    get:
      operationId: getPipelineEvolution
      tags: [experiments]
      summary: Pipeline evolution history showing prompt overrides and score progression
      responses:
        "200":
          description: Pipeline evolution records
          content:
            application/json:
              schema:
                type: object
                properties:
                  generations:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        parentConfigId: { type: string, nullable: true }
                        generation: { type: integer }
                        promptOverrides: { type: object }
                        description: { type: string }
                        avgCompositeScore: { type: number, nullable: true }
                        dealCount: { type: integer }
                        isCurrent: { type: boolean }
                        createdAt: { type: string, format: date-time }
                      required: [id, generation, promptOverrides, description, dealCount, isCurrent, createdAt]
                  currentGeneration: { type: integer }
                required: [generations, currentGeneration]

  /experiments:
    get:
      operationId: listExperiments
      tags: [experiments]
      summary: List experiments
      parameters:
        - name: task
          in: query
          schema:
            type: string
            enum: [A, B, both]
        - name: retained
          in: query
          schema:
            type: boolean
        - name: cycleId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of experiments
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Experiment"
                  total:
                    type: integer
                required: [data, total]

  /experiments/stats:
    get:
      operationId: getExperimentStats
      tags: [experiments]
      summary: Aggregate experiment statistics
      responses:
        "200":
          description: Experiment stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExperimentStats"

  /costs:
    get:
      operationId: listCosts
      tags: [costs]
      summary: List cost-of-war records
      parameters:
        - name: stakeholderId
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of cost records
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/CostOfWar"
                required: [data]

  /costs/{stakeholderId}:
    get:
      operationId: getCostsByStakeholder
      tags: [costs]
      summary: Get latest cost-of-war for a stakeholder
      parameters:
        - name: stakeholderId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Cost detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostOfWar"
        "404":
          description: Not found

  /evidence:
    get:
      operationId: listEvidence
      tags: [evidence]
      summary: List evidence items
      parameters:
        - name: source
          in: query
          schema:
            type: string
        - name: evidenceType
          in: query
          schema:
            type: string
        - name: stakeholderId
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: List of evidence items
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceItem"
                  total:
                    type: integer
                required: [data, total]

  /changelog:
    get:
      operationId: listChangelog
      tags: [changelog]
      summary: List changelog entries
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Changelog entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ChangelogEntry"
                  total:
                    type: integer
                required: [data, total]

  /changelog/{id}:
    get:
      operationId: getChangelogEntry
      tags: [changelog]
      summary: Get a single changelog entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Changelog entry detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangelogEntry"
        "404":
          description: Not found

  /stakeholders:
    get:
      operationId: listStakeholders
      tags: [stakeholders]
      summary: List all stakeholders
      parameters:
        - name: role
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of stakeholders
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Stakeholder"
                required: [data]

  /stakeholders/{id}:
    get:
      operationId: getStakeholder
      tags: [stakeholders]
      summary: Get a single stakeholder
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stakeholder detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stakeholder"
        "404":
          description: Not found

  /admin/config:
    get:
      operationId: getAdminConfig
      tags: [admin]
      summary: Get admin configuration
      security:
        - adminKey: []
      responses:
        "200":
          description: Admin configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigResponse"
        "401":
          description: Unauthorized
    post:
      operationId: updateAdminConfig
      tags: [admin]
      summary: Update admin configuration
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminConfigUpdate"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminConfigResponse"
        "401":
          description: Unauthorized

  /admin/run:
    post:
      operationId: triggerRun
      tags: [admin]
      summary: Trigger an immediate autoresearch cycle
      security:
        - adminKey: []
      responses:
        "200":
          description: Run triggered
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycleId:
                    type: string
                  message:
                    type: string
                required: [cycleId, message]
        "401":
          description: Unauthorized
        "409":
          description: Already running

  /admin/sources:
    get:
      operationId: listEvidenceSources
      tags: [admin]
      summary: List evidence sources
      security:
        - adminKey: []
      responses:
        "200":
          description: Evidence sources
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/EvidenceSource"
                required: [data]
        "401":
          description: Unauthorized

  /admin/sources/{id}:
    patch:
      operationId: updateEvidenceSource
      tags: [admin]
      summary: Update an evidence source
      security:
        - adminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvidenceSourceUpdate"
      responses:
        "200":
          description: Updated source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvidenceSource"
        "401":
          description: Unauthorized
        "404":
          description: Not found

  /admin/costs-summary:
    get:
      operationId: getAdminCostsSummary
      tags: [admin]
      summary: Get LLM provider cost summary
      security:
        - adminKey: []
      responses:
        "200":
          description: Cost summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CostSummary"
        "401":
          description: Unauthorized

  /admin/deal-cycles:
    get:
      operationId: listDealCycles
      tags: [admin]
      summary: List recent deal autoresearch cycles with status
      security:
        - adminKey: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: List of deal cycles
          content:
            application/json:
              schema:
                type: object
                properties:
                  cycles:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                        status:
                          type: string
                          enum: [running, complete, error]
                        startedAt:
                          type: string
                          format: date-time
                        completedAt:
                          type: string
                          format: date-time
                          nullable: true
                        dealId:
                          type: string
                          nullable: true
                        error:
                          type: string
                          nullable: true
                      required: [id, status, startedAt]
                required: [cycles]
        "401":
          description: Unauthorized

  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List all AI-generated deals
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: architecture
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of deals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Deal"
                  total:
                    type: integer
                required: [data, total]

  /deals/current:
    get:
      operationId: getCurrentDeal
      tags: [deals]
      summary: Get the current best AI-generated deal
      responses:
        "200":
          description: Current best deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: No deal found yet

  /deals/current/narrative:
    get:
      operationId: getCurrentDealNarrative
      tags: [deals]
      summary: Get a concise narrative summary of the current champion deal
      parameters:
        - name: generate
          in: query
          required: false
          schema:
            type: string
            enum: ["true", "false"]
          description: If "true" and no narrative exists yet, generates one on-demand via LLM
      responses:
        "200":
          description: Narrative summary of the current deal
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealId:
                    type: string
                  architecture:
                    type: string
                  composite:
                    type: number
                    nullable: true
                  narrative:
                    type: string
                    nullable: true
                  generating:
                    type: boolean
                  generationError:
                    type: string
                  createdAt:
                    type: string
                    format: date-time
                  totalDeals:
                    type: integer
                required: [dealId, architecture, createdAt]
        "404":
          description: No deal found yet

  /deals/pareto:
    get:
      operationId: getParetoDeals
      tags: [deals]
      summary: Get Pareto frontier of deals (non-dominated set)
      responses:
        "200":
          description: Pareto frontier deals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Deal"
                required: [data]

  /deals/tree:
    get:
      operationId: getSolutionTree
      tags: [deals]
      summary: Get the full solution tree of explored deals
      responses:
        "200":
          description: Solution tree nodes
          content:
            application/json:
              schema:
                type: object
                properties:
                  nodes:
                    type: array
                    items:
                      $ref: "#/components/schemas/SolutionTreeNode"
                required: [nodes]

  /deals/history:
    get:
      operationId: getDealHistory
      tags: [deals]
      summary: List all deals ordered by creation time with lightweight payload
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Historical deal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        cycleId: { type: string }
                        architecture: { type: string }
                        scores: { $ref: "#/components/schemas/DealScores" }
                        diagnosis: { type: string, nullable: true }
                        isCurrent: { type: boolean }
                        isPareto: { type: boolean }
                        generatedBy: { type: string }
                        tokensConsumed: { type: integer }
                        costUsd: { type: number }
                        createdAt: { type: string, format: date-time }
                      required: [id, cycleId, architecture, isCurrent, isPareto, generatedBy, tokensConsumed, costUsd, createdAt]
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                required: [data, total, offset, limit]

  /deals/robustness:
    get:
      operationId: getDealRobustness
      tags: [deals]
      summary: Red-team attack survival rate and severity breakdown across recent deals
      parameters:
        - name: n
          in: query
          description: Number of most recent deals to analyze (max 50)
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Robustness report
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealsSampled: { type: integer }
                  totalAttacks: { type: integer }
                  survivedAttacks: { type: integer }
                  survivalRate: { type: number, nullable: true }
                  criticalFails: { type: integer }
                  bySeverity:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        total: { type: integer }
                        survived: { type: integer }
                      required: [total, survived]
                  deals:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        architecture: { type: string }
                        composite: { type: number, nullable: true }
                        createdAt: { type: string, format: date-time }
                required: [dealsSampled, totalAttacks, survivedAttacks, criticalFails, bySeverity, deals]

  /deals/compare:
    get:
      operationId: compareDeals
      tags: [deals]
      summary: Compare 2-10 deals side-by-side across all scoring dimensions
      parameters:
        - name: ids
          in: query
          required: true
          description: Comma-separated list of deal IDs (2–10)
          schema:
            type: string
      responses:
        "200":
          description: Side-by-side comparison
          content:
            application/json:
              schema:
                type: object
                properties:
                  deals:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        architecture: { type: string }
                        isCurrent: { type: boolean }
                        isPareto: { type: boolean }
                        generatedBy: { type: string }
                        diagnosis: { type: string, nullable: true }
                        scores:
                          type: object
                          additionalProperties:
                            type: number
                            nullable: true
                        createdAt: { type: string, format: date-time }
                      required: [id, architecture, isCurrent, isPareto, generatedBy, scores, createdAt]
                  leaders:
                    type: object
                    additionalProperties:
                      type: string
                      nullable: true
                required: [deals, leaders]
        "400":
          description: Invalid ids parameter (need 2-10 IDs)
        "404":
          description: No matching deals found

  /deals/{id}/stakeholder-evals:
    get:
      operationId: getDealStakeholderEvals
      tags: [deals]
      summary: Get stakeholder evaluations, domestic evals, and negotiator amendments for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Stakeholder evaluation detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  dealId: { type: string }
                  architecture: { type: string }
                  stakeholderEvaluations:
                    type: object
                    additionalProperties:
                      $ref: "#/components/schemas/StakeholderVerdict"
                  domesticEvaluations:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        audience: { type: string }
                        verdict:
                          type: string
                          enum: [sellable, difficult, unsellable]
                        rationale: { type: string }
                  negotiatorAmendments:
                    nullable: true
                    type: object
                  summary:
                    type: object
                    properties:
                      accept: { type: integer }
                      conditional: { type: integer }
                      reject: { type: integer }
                    required: [accept, conditional, reject]
                required: [dealId, architecture, summary]
        "404":
          description: Deal not found

  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      summary: Get a single deal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: Not found

  /deals/{id}/llm.md:
    get:
      operationId: getDealMarkdown
      tags: [deals]
      summary: Get a deal as a markdown document for LLM consumption
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deal as markdown text
          content:
            text/markdown:
              schema:
                type: string
        "404":
          description: Not found

  /deals/{id}/share-text:
    post:
      operationId: generateDealShareText
      tags: [deals]
      summary: Generate LLM-powered social media share text for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                platform:
                  type: string
                  enum: [twitter, facebook, linkedin, reddit]
              required: [platform]
      responses:
        "200":
          description: Generated share text
          content:
            application/json:
              schema:
                type: object
                properties:
                  platform:
                    type: string
                  text:
                    type: string
                  permalinkUrl:
                    type: string
                required: [platform, text, permalinkUrl]
        "400":
          description: Invalid platform
        "404":
          description: Deal not found

  /proposals:
    get:
      operationId: listProposals
      tags: [proposals]
      summary: List real-world proposals (US plan, Iran counterproposal, etc.)
      responses:
        "200":
          description: List of proposals
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Proposal"
                required: [data]
    post:
      operationId: createProposal
      tags: [proposals]
      summary: Create a new real-world proposal (admin only)
      security:
        - adminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProposalRequest"
      responses:
        "201":
          description: Created proposal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "401":
          description: Unauthorized

  /proposals/arena:
    get:
      operationId: getProposalArena
      tags: [proposals]
      summary: Get all proposals with current AI deal for arena comparison
      responses:
        "200":
          description: Proposal arena data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposalArena"

  /proposals/{id}:
    get:
      operationId: getProposal
      tags: [proposals]
      summary: Get a single proposal by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Proposal detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Proposal"
        "404":
          description: Not found

  /admin/proposals/{id}/evaluate:
    post:
      operationId: evaluateProposal
      tags: [proposals, admin]
      summary: Run AI evaluation pipeline on a real-world proposal (admin only)
      description: Runs stakeholder evaluation, judge scoring, and what-would-it-take analysis on the proposal and persists results.
      security:
        - adminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Evaluated proposal
          content:
            application/json:
              schema:
                type: object
                properties:
                  proposal:
                    $ref: "#/components/schemas/Proposal"
                required: [proposal]
        "401":
          description: Unauthorized
        "404":
          description: Proposal not found

  /admin/pipeline/config:
    get:
      operationId: getPipelineConfig
      tags: [admin]
      summary: Get the current pipeline stage-to-provider-model assignment (admin only)
      security:
        - adminKey: []
      responses:
        "200":
          description: Pipeline configuration
          content:
            application/json:
              schema:
                type: object
                properties:
                  stages:
                    type: array
                    items:
                      type: object
                      properties:
                        stage: { type: integer }
                        name: { type: string }
                        role: { type: string }
                        provider: { type: string, enum: [anthropic, openai, gemini] }
                        model: { type: string }
                      required: [stage, name, role, provider, model]
                  constraint: { type: string }
                required: [stages, constraint]
        "401":
          description: Unauthorized

  /community-forecasts:
    post:
      operationId: submitCommunityForecast
      tags: [community]
      summary: Submit a community probability forecast
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sessionId:
                  type: string
                timeHorizon:
                  type: string
                  enum: [10d, 30d, 90d, 180d, 1y]
                estimates:
                  type: object
                  additionalProperties:
                    type: number
              required: [sessionId, timeHorizon, estimates]
      responses:
        "200":
          description: Forecast submitted
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  message: { type: string }
                required: [id, message]
        "400":
          description: Invalid input

  /community-forecasts/aggregate:
    get:
      operationId: getCommunityForecastAggregate
      tags: [community]
      summary: Get aggregated community forecast for a time horizon
      parameters:
        - name: timeHorizon
          in: query
          schema:
            type: string
            enum: [10d, 30d, 90d, 180d, 1y]
            default: 90d
      responses:
        "200":
          description: Aggregated community forecast
          content:
            application/json:
              schema:
                type: object
                properties:
                  timeHorizon: { type: string }
                  count: { type: integer }
                  aggregated:
                    type: object
                    additionalProperties:
                      type: number
                  outcomes:
                    type: array
                    items:
                      type: string
                required: [timeHorizon, count, aggregated, outcomes]

  /proposals/submit:
    post:
      operationId: submitPublicProposal
      tags: [proposals, community]
      summary: Submit a real-world proposal for community review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submitterName: { type: string }
                sourceUrl: { type: string }
                sourceName: { type: string }
                summary: { type: string }
                terms:
                  type: object
                  additionalProperties: true
              required: [sourceUrl, sourceName, summary, terms]
      responses:
        "200":
          description: Submission received
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  message: { type: string }
                required: [id, message]
        "400":
          description: Invalid input

  /admin/proposals/queue:
    get:
      operationId: getProposalQueue
      tags: [admin, proposals]
      summary: Get the admin proposal review queue
      security:
        - adminKey: []
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, approved, rejected]
            default: pending
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Proposal queue
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        submitterName: { type: string }
                        sourceUrl: { type: string }
                        sourceName: { type: string }
                        summary: { type: string }
                        status: { type: string }
                        submittedAt: { type: string, format: date-time }
                      required: [id, submitterName, sourceUrl, sourceName, summary, status, submittedAt]
                  total: { type: integer }
                required: [data, total]
        "401":
          description: Unauthorized

  /admin/proposals/queue/{id}:
    patch:
      operationId: reviewProposalSubmission
      tags: [admin, proposals]
      summary: Approve or reject a queued proposal submission
      security:
        - adminKey: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [approve, reject]
                adminNotes: { type: string }
              required: [action]
      responses:
        "200":
          description: Review applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  approvedProposalId:
                    type: string
                    nullable: true
                required: [message]
        "401":
          description: Unauthorized
        "404":
          description: Not found
        "409":
          description: Already reviewed

  /admin/proposals/queue/{id}/terms:
    patch:
      operationId: editProposalSubmissionTerms
      tags: [proposals, admin]
      summary: Edit proposal submission summary/terms before approval (admin only)
      security:
        - adminKey: []
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary:
                  type: string
                  description: Updated proposal summary text
                terms:
                  type: object
                  description: Updated deal terms object
      responses:
        "200":
          description: Submission terms updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
                  id: { type: string }
                required: [message, id]
        "400":
          description: No updates provided
        "401":
          description: Unauthorized
        "404":
          description: Submission not found
        "409":
          description: Cannot edit an already-reviewed submission

  /downloads/index:
